server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Docker internal DNS resolver to avoid stale IP caching if backend restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, admin and Django's static files (admin CSS etc.) go to the backend.
    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images and videos, from the shared media volume.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    # Vite build assets are content-hashed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
